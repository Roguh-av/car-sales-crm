<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033"><link rel="manifest" href="manifest.json"><title>Car Sales CRM</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--nav:#172033;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.hide{display:none!important}
.app{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:225px;background:var(--nav);padding:18px 12px;color:white}.brand{font-size:20px;font-weight:800;padding:0 10px 18px}.nav button{width:100%;border:0;background:none;color:#cbd5e1;padding:11px;text-align:left;border-radius:9px;cursor:pointer}.nav button.active{background:#263248;color:white}
.main{margin-left:225px;width:calc(100% - 225px);padding:20px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:25px}h2{font-size:17px}.label{font-size:12px;color:var(--muted)}.btn{border:0;background:var(--accent);color:white;padding:10px 13px;border-radius:9px;font-weight:700;cursor:pointer}.secondary{background:#e7edfb;color:#1743a5}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.card{background:white;border:1px solid var(--line);border-radius:11px;padding:13px}.metric{font-size:27px;font-weight:800}.card.clickable{cursor:pointer;transition:border-color .15s}.card.clickable:hover{border-color:#b8c6e5}.card.clickable:focus{outline:3px solid #bfdbfe;outline-offset:2px}.section{margin-top:20px}.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:white}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.filters button{border:1px solid var(--line);background:white;padding:7px 10px;border-radius:999px;cursor:pointer}.filters button.active{background:var(--accent);color:white}
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:9px;overflow:auto}.col{background:#edf1f5;border-radius:10px;padding:9px;min-height:250px}.lead{background:white;border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:8px;cursor:pointer}.pill{font-size:11px;background:#eef2ff;border-radius:999px;padding:4px 7px}.hot{background:#fee2e2;color:#991b1b}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:auto}.day{background:white;min-height:220px;padding:8px}.dayhead{text-align:center;font-size:12px;font-weight:800;border-bottom:1px solid var(--line);padding-bottom:6px}.event{width:100%;border:0;color:white;background:#1688a8;border-radius:7px;padding:7px;text-align:left;margin-top:6px;font-size:11px;cursor:pointer}.event.past{background:#b83232}.event.today{background:#2463a6}.event.done{background:#238636}
table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--muted)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:50}.modal.show{display:flex}.box{width:min(720px,100%);max-height:92vh;overflow:auto;background:white;border-radius:13px;padding:17px}.head{display:flex;justify-content:space-between}.close{border:0;background:none;font-size:24px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:var(--muted);font-weight:700}.form input,.form select,.form textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin-top:4px}.full{grid-column:1/-1}.hist{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:8px}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.authbox{width:min(420px,100%);background:white;padding:22px;border:1px solid var(--line);border-radius:13px}.authbox input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:5px 0 11px}
@media(max-width:800px){.side{width:68px;padding:10px 6px}.brand{font-size:0;text-align:center}.brand:after{content:"🚗";font-size:23px}.nav button{font-size:0;text-align:center}.nav button:before{font-size:19px}.nav button[data-p=dashboard]:before{content:"🏠"}.nav button[data-p=leads]:before{content:"🔥"}.nav button[data-p=customers]:before{content:"👥"}.nav button[data-p=leases]:before{content:"🟣"}.nav button[data-p=deliveries]:before{content:"📦"}.nav button[data-p=completed]:before{content:"✅"}.main{margin-left:68px;width:calc(100% - 68px);padding:13px}.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.full{grid-column:auto}.week{grid-template-columns:repeat(7,minmax(175px,1fr))}}
</style></head><body>
<div id="auth" class="auth"><div class="authbox"><h1>Car Sales CRM</h1><p class="label">Cloud CRM — phone + computer sync</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><div style="display:flex;gap:8px"><button id="signin" class="btn">Sign in</button><button id="signup" class="btn secondary">Create account</button></div><p id="authmsg" class="label"></p></div></div>
<div id="crm" class="app hide"><aside class="side"><div class="brand">Car Sales CRM</div><div class="nav"><button class="active" data-p="dashboard">Dashboard</button><button data-p="leads">Leads</button><button data-p="customers">Customers</button><button data-p="leases">Leases</button><button data-p="deliveries">Deliveries</button><button data-p="completed">Sold / Lost / Delivered</button><button id="signoutBtn">Sign out</button></div></aside>
<main class="main">
<section id="dashboard" class="page"><div class="top"><div><h1>Sales Calendar</h1><div class="label">Your daily working screen</div></div><button class="btn" onclick="openLead()">+ New Lead</button></div><div id="metrics" class="cards"></div><div class="filters" id="calfilters"><button class="active" data-f="all">All</button><button data-f="followups">Follow-ups</button><button data-f="appointments">Appointments</button><button data-f="deliveries">Deliveries</button></div><div id="calendar" class="week"></div><div class="section"><h2>Action Needed</h2><div id="actions"></div></div></section>
<section id="leads" class="page hide"><div class="top"><h1>Leads</h1><button class="btn" onclick="openLead()">+ New Lead</button></div><div class="filters" id="leadfilters"><button class="active" data-f="all">All</button><button data-f="hot">🔥 Hot</button><button data-f="facebook">Facebook</button><button data-f="ups">Ups</button><button data-f="overdue">Overdue</button><button data-f="nofollow">No Follow-up</button></div><input id="leadsearch" class="search" placeholder="Search leads..."><div id="pipeline" class="pipeline section"></div></section>
<section id="customers" class="page hide"><div class="top"><h1>Customers / Contacts</h1><button class="btn" onclick="openCustomer()">+ New Customer</button></div><input id="custsearch" class="search" placeholder="Search name, phone, city..."><div id="custtable" class="section"></div></section>
<section id="leases" class="page hide"><div class="top"><h1>Lease Customers</h1></div><input id="leasesearch" class="search" placeholder="Search customer, vehicle, VIN, stock..."><div id="leasetable" class="section"></div></section>
<section id="deliveries" class="page hide"><div class="top"><h1>Deliveries</h1><button class="btn" onclick="openDelivery()">+ Delivery</button></div><div id="deliverytable"></div></section>
<section id="completed" class="page hide"><h1>Sold / Lost / Delivered</h1><div id="completedtable" class="section"></div></section>
</main></div>
<div id="modal" class="modal"><div class="box"><div class="head"><h2 id="mtitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="mbody"></div></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://rydegsmcsthjzhynggni.supabase.co','sb_publishable_yIbG5imkO7ESMcAQTEsUyQ_9tnr3z95'); let user=null,DB={customers:[],leads:[],history:[],followups:[],deliveries:[],leases:[]},leadFilter='all',calFilter='all';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const dk=x=>new Date(x).toISOString().slice(0,10),today=()=>dk(new Date()),cust=id=>DB.customers.find(x=>x.id===id)||{},fmt=x=>x?new Date(x).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):'—';
async function load(){for(const [k,t] of Object.entries({customers:'customers',leads:'leads',history:'lead_history',followups:'followups',deliveries:'deliveries',leases:'leases'})){let {data,error}=await sb.from(t).select('*');if(error)throw error;DB[k]=data||[]}}
async function enter(){await load();$('#auth').classList.add('hide');$('#crm').classList.remove('hide');render()}
async function init(){let {data}=await sb.auth.getSession();user=data.session?.user||null;if(user)await enter();sb.auth.onAuthStateChange(async(_,s)=>{user=s?.user||null;if(user)await enter()})}
$('#signin').onclick=async()=>{let {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});$('#authmsg').textContent=error?.message||''};
$('#signup').onclick=async()=>{let {data,error}=await sb.auth.signUp({email:$('#email').value,password:$('#password').value});$('#authmsg').textContent=error?.message||(data.session?'Account created.':'Check your email to confirm, then sign in.')};
function page(id){$$('.page').forEach(x=>x.classList.add('hide'));$('#'+id).classList.remove('hide');$$('.nav button[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===id));render()} $$('.nav button[data-p]').forEach(x=>x.onclick=()=>page(x.dataset.p)); $('#signoutBtn').onclick=async()=>{await sb.auth.signOut();$('#crm').classList.add('hide');$('#auth').classList.remove('hide');};
function tab(h,r){return r.length?`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.join('')}</tbody></table>`:'<div class="card label">No records.</div>'}
function render(){dashboard();leads();customers();leases();deliveries();completed()}
function dashboard(){let active=DB.leads.filter(x=>!x.archived&&!['Sold','Lost'].includes(x.status)),due=DB.followups.filter(x=>x.status!=='Done'&&dk(x.scheduled_at)<=today()),hot=active.filter(x=>x.priority==='Hot'),ap=DB.followups.filter(x=>x.status!=='Done'&&x.action_type==='Appointment'&&dk(x.scheduled_at)===today());$('#metrics').innerHTML=[
['Active Leads',active.length,'active'],
['Follow-ups Due',due.length,'followups'],
['Hot Leads',hot.length,'hot'],
['Appointments Today',ap.length,'appointments']
].map(x=>`<div class="card clickable" tabindex="0" role="button" data-shortcut="${x[2]}"><div class="metric">${x[1]}</div><div class="label">${x[0]}</div></div>`).join('');
$$('#metrics [data-shortcut]').forEach(el=>{
  const go=()=>dashboardShortcut(el.dataset.shortcut);
  el.addEventListener('click',go);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
});
calendar();actions()}
function days(){let d=new Date(),s=new Date(d);s.setDate(d.getDate()-d.getDay());return Array.from({length:7},(_,i)=>{let x=new Date(s);x.setDate(s.getDate()+i);return x})}
function calendar(){$('#calendar').innerHTML=days().map(d=>{let k=dk(d),ev=[];DB.followups.filter(x=>dk(x.scheduled_at)===k).forEach(x=>{let a=x.action_type==='Appointment';if(calFilter!=='all'&&calFilter!==(a?'appointments':'followups'))return;let cl=x.status==='Done'?'done':k<today()?'past':k===today()?'today':'';ev.push(`<button class="event ${cl}" onclick="openLeadFile('${x.lead_id||''}')">${esc(x.action_type)}<br><b>${esc(cust(x.customer_id).name)}</b></button>`)});DB.deliveries.filter(x=>x.delivery_at&&dk(x.delivery_at)===k).forEach(x=>{if(!['all','deliveries'].includes(calFilter))return;let cl=x.status==='Delivered'?'done':k<today()?'past':k===today()?'today':'';ev.push(`<button class="event ${cl}" onclick="openLeadFile('${x.lead_id||''}')">Delivery<br><b>${esc(cust(x.customer_id).name)}</b></button>`)});return `<div class="day"><div class="dayhead">${d.toLocaleDateString([],{weekday:'short'})} ${d.getMonth()+1}/${d.getDate()}</div>${ev.join('')||'<div class="label" style="padding:10px;text-align:center">No events</div>'}</div>`}).join('')}

function dashboardShortcut(kind){
  if(kind==='active'){
    leadFilter='all';
    $$('#leadfilters button').forEach(b=>b.classList.toggle('active',b.dataset.f==='all'));
    page('leads'); return;
  }
  if(kind==='hot'){
    leadFilter='hot';
    $$('#leadfilters button').forEach(b=>b.classList.toggle('active',b.dataset.f==='hot'));
    page('leads'); return;
  }
  if(kind==='followups'){ openDueFollowupsList(); return; }
  if(kind==='appointments'){ openTodayAppointmentsList(); }
}
function openDueFollowupsList(){
  const rows=DB.followups.filter(x=>x.status!=='Done'&&dk(x.scheduled_at)<=today())
    .sort((a,b)=>new Date(a.scheduled_at)-new Date(b.scheduled_at));
  modal('Follow-ups Due',rows.length?tab(['Customer','Phone','Action','Scheduled','Status'],rows.map(x=>{
    const c=cust(x.customer_id);
    return `<tr><td>${x.lead_id?`<button class="btn secondary" onclick="openLeadFile('${x.lead_id}')">${esc(c.name)}</button>`:esc(c.name)}</td><td>${esc(c.phone||'')}</td><td>${esc(x.action_type)}</td><td>${fmt(x.scheduled_at)}</td><td><select onchange="followupStatus('${x.id}',this.value)"><option ${x.status==='Open'?'selected':''}>Open</option><option ${x.status==='Done'?'selected':''}>Done</option></select></td></tr>`;
  })):'<div class="card label">No follow-ups are due.</div>');
}
function openTodayAppointmentsList(){
  const rows=DB.followups.filter(x=>x.status!=='Done'&&x.action_type==='Appointment'&&dk(x.scheduled_at)===today())
    .sort((a,b)=>new Date(a.scheduled_at)-new Date(b.scheduled_at));
  modal('Appointments Today',rows.length?tab(['Customer','Phone','Time','Notes','Status'],rows.map(x=>{
    const c=cust(x.customer_id);
    return `<tr><td>${x.lead_id?`<button class="btn secondary" onclick="openLeadFile('${x.lead_id}')">${esc(c.name)}</button>`:esc(c.name)}</td><td>${esc(c.phone||'')}</td><td>${fmt(x.scheduled_at)}</td><td>${esc(x.notes||'')}</td><td><select onchange="followupStatus('${x.id}',this.value)"><option ${x.status==='Open'?'selected':''}>Open</option><option ${x.status==='Done'?'selected':''}>Done</option></select></td></tr>`;
  })):'<div class="card label">No appointments scheduled for today.</div>');
}
window.followupStatus=async(id,status)=>{
  const {error}=await sb.from('followups').update({status}).eq('id',id);
  if(error)return alert(error.message);
  await load(); render();
};

$('#calfilters').onclick=e=>{if(e.target.dataset.f){calFilter=e.target.dataset.f;$$('#calfilters button').forEach(b=>b.classList.toggle('active',b===e.target));calendar()}};
function actions(){let a=[];DB.followups.filter(x=>x.status!=='Done'&&dk(x.scheduled_at)<=today()).forEach(x=>a.push({t:`${x.action_type} — ${cust(x.customer_id).name}`,s:fmt(x.scheduled_at),id:x.lead_id}));DB.deliveries.filter(x=>x.status!=='Delivered'&&x.delivery_at&&dk(x.delivery_at)<=today()).forEach(x=>a.push({t:`Delivery — ${cust(x.customer_id).name}`,s:x.status,id:x.lead_id}));$('#actions').innerHTML=a.length?a.map(x=>`<div class="card" style="margin-top:7px;cursor:pointer" onclick="openLeadFile('${x.id||''}')"><b>${esc(x.t)}</b><div class="label">${esc(x.s)}</div></div>`).join(''):'<div class="card label">Nothing urgent.</div>'}
$('#leadfilters').onclick=e=>{if(e.target.dataset.f){leadFilter=e.target.dataset.f;$$('#leadfilters button').forEach(b=>b.classList.toggle('active',b===e.target));leads()}};$('#leadsearch').oninput=leads;
function leads(){let q=$('#leadsearch').value.toLowerCase(),a=DB.leads.filter(x=>!x.archived&&!['Sold','Lost'].includes(x.status));if(q)a=a.filter(x=>(cust(x.customer_id).name+' '+x.vehicle+' '+x.source).toLowerCase().includes(q));if(leadFilter==='hot')a=a.filter(x=>x.priority==='Hot');if(leadFilter==='facebook')a=a.filter(x=>String(x.source).toLowerCase().includes('facebook'));if(leadFilter==='ups')a=a.filter(x=>String(x.source).toLowerCase().includes('up'));if(leadFilter==='overdue')a=a.filter(x=>DB.followups.some(f=>f.lead_id===x.id&&f.status!=='Done'&&dk(f.scheduled_at)<today()));if(leadFilter==='nofollow')a=a.filter(x=>!DB.followups.some(f=>f.lead_id===x.id&&f.status!=='Done'));let st=['New','Contacted','Appointment','Showed','Negotiating'];$('#pipeline').innerHTML=st.map(s=>{let z=a.filter(x=>x.status===s);return `<div class="col"><b>${s} (${z.length})</b>${z.map(x=>`<div class="lead" onclick="openLeadFile('${x.id}')"><span class="pill">Lead #${x.lead_number}</span> ${x.priority==='Hot'?'<span class="pill hot">🔥 Hot</span>':''}<b style="display:block;margin-top:5px">${esc(cust(x.customer_id).name)}</b><div class="label">${esc(x.vehicle||'')} · ${esc(x.source||'')}</div></div>`).join('')}</div>`}).join('')}
$('#custsearch').oninput=customers;function customers(){let q=$('#custsearch').value.toLowerCase(),a=DB.customers.filter(x=>!x.archived&&!['Sold','Lost','Delivered'].includes(x.status));if(q)a=a.filter(x=>(x.name+' '+x.phone+' '+x.city).toLowerCase().includes(q));$('#custtable').innerHTML=tab(['Name','Phone','City','Status'],a.map(x=>`<tr><td><button class="btn secondary" onclick="customerFile('${x.id}')">${esc(x.name)}</button></td><td>${esc(x.phone||'')}</td><td>${esc(x.city||'')}</td><td>${esc(x.status)}</td></tr>`))}
$('#leasesearch').oninput=leases;function leases(){let q=$('#leasesearch').value.toLowerCase(),a=[...DB.leases].sort((x,y)=>(x.lease_end_date||'').localeCompare(y.lease_end_date||''));if(q)a=a.filter(x=>((cust(x.customer_id).name||'')+' '+x.vehicle+' '+x.vin+' '+x.stock_number).toLowerCase().includes(q));$('#leasetable').innerHTML=tab(['Customer','Phone','Vehicle','Stock','Lease End'],a.map(x=>`<tr><td>${esc(cust(x.customer_id).name)}</td><td>${esc(cust(x.customer_id).phone||'')}</td><td>${esc(x.vehicle)}</td><td>${esc(x.stock_number||'')}</td><td>${esc(x.lease_end_date||'')}</td></tr>`))}
function deliveries(){$('#deliverytable').innerHTML=tab(['Customer','Vehicle','Prep','Delivery','Status'],DB.deliveries.map(x=>`<tr><td>${esc(cust(x.customer_id).name)}</td><td>${esc(x.vehicle)}</td><td>${esc(x.prep_date||'')}</td><td>${fmt(x.delivery_at)}</td><td><select onchange="deliveryStatus('${x.id}',this.value)"><option ${x.status==='In Prep'?'selected':''}>In Prep</option><option ${x.status==='Ready'?'selected':''}>Ready</option><option ${x.status==='Delivered'?'selected':''}>Delivered</option></select></td></tr>`))}
function completed(){let r=DB.leads.filter(x=>['Sold','Lost'].includes(x.status)).map(x=>`<tr><td>${esc(cust(x.customer_id).name)}</td><td>${esc(x.vehicle||'')}</td><td>${x.status}</td><td>Lead #${x.lead_number}</td></tr>`).concat(DB.deliveries.filter(x=>x.status==='Delivered').map(x=>`<tr><td>${esc(cust(x.customer_id).name)}</td><td>${esc(x.vehicle)}</td><td>Delivered</td><td>${fmt(x.delivery_at)}</td></tr>`));$('#completedtable').innerHTML=tab(['Customer','Vehicle','Outcome','Reference'],r)}
function modal(t,b){$('#mtitle').textContent=t;$('#mbody').innerHTML=b;$('#modal').classList.add('show')} window.closeModal=()=>$('#modal').classList.remove('show');
const opts=()=>DB.customers.map(c=>`<option value="${c.id}">${esc(c.name)} — ${esc(c.phone||'')}</option>`).join('');
window.openLead=()=>{modal('New Lead',`<form id="f" class="form"><label>Existing Customer<select name="customer_id"><option value="">New customer below</option>${opts()}</select></label><label>New Customer Name<input name="name"></label><label>Phone<input name="phone"></label><label>Vehicle<input name="vehicle"></label><label>Source<select name="source"><option>Ups</option><option>Facebook Marketplace</option><option>Facebook Lead Ad</option><option>Phone</option><option>Website</option><option>Referral</option><option>Lease maturity</option></select></label><label>Priority<select name="priority"><option>Normal</option><option>Hot</option><option>Low</option></select></label><label>Stock #<input name="stock_number"></label><label class="full">Notes<textarea name="notes"></textarea></label><div class="full"><button class="btn">Create Lead</button></div></form>`);$('#f').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),cid=o.customer_id;if(!cid){if(!o.name)return alert('Enter customer name');let {data,error}=await sb.from('customers').insert({owner_id:user.id,name:o.name,phone:o.phone||null,source:o.source}).select().single();if(error)return alert(error.message);cid=data.id}let {data,error}=await sb.from('leads').insert({owner_id:user.id,customer_id:cid,vehicle:o.vehicle||null,source:o.source,priority:o.priority,stock_number:o.stock_number||null,notes:o.notes||null}).select().single();if(error)return alert(error.message);await sb.from('lead_history').insert({owner_id:user.id,lead_id:data.id,event_type:'Lead created',note:o.notes||null});closeModal();await load();render();openLeadFile(data.id)}}
window.openCustomer=()=>{modal('New Customer',`<form id="f" class="form"><label>Name<input name="name" required></label><label>Phone<input name="phone"></label><label>Email<input name="email"></label><label>City<input name="city"></label><label class="full">Notes<textarea name="notes"></textarea></label><div class="full"><button class="btn">Save</button></div></form>`);$('#f').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let {error}=await sb.from('customers').insert({...o,owner_id:user.id});if(error)return alert(error.message);closeModal();await load();render()}}
window.openFollowup=(lid='',cid='')=>{modal('Next Action',`<form id="f" class="form"><label>Customer<select name="customer_id">${opts()}</select></label><label>Action<select name="action_type"><option>Call</option><option>Text</option><option>Email</option><option>Appointment</option><option>General follow-up</option></select></label><label>Date / Time<input type="datetime-local" name="scheduled_at" required></label><label class="full">Notes<textarea name="notes"></textarea></label><div class="full"><button class="btn">Schedule</button></div></form>`);if(cid)$('#f [name=customer_id]').value=cid;$('#f').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let {error}=await sb.from('followups').insert({owner_id:user.id,customer_id:o.customer_id,lead_id:lid||null,action_type:o.action_type,scheduled_at:new Date(o.scheduled_at).toISOString(),notes:o.notes||null});if(error)return alert(error.message);if(lid)await sb.from('lead_history').insert({owner_id:user.id,lead_id:lid,event_type:o.action_type,note:o.notes||null});closeModal();await load();render()}}
window.openDelivery=(lid='',cid='',vehicle='')=>{modal('Schedule Delivery',`<form id="f" class="form"><label>Customer<select name="customer_id">${opts()}</select></label><label>Vehicle<input name="vehicle" value="${esc(vehicle)}"></label><label>Stock #<input name="stock_number"></label><label>Prep Date<input type="date" name="prep_date"></label><label>Delivery Date / Time<input type="datetime-local" name="delivery_at"></label><label>Status<select name="status"><option>In Prep</option><option>Ready</option><option>Delivered</option></select></label><label class="full">Notes<textarea name="notes"></textarea></label><div class="full"><button class="btn">Save</button></div></form>`);if(cid)$('#f [name=customer_id]').value=cid;$('#f').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let {error}=await sb.from('deliveries').insert({owner_id:user.id,customer_id:o.customer_id,lead_id:lid||null,vehicle:o.vehicle,stock_number:o.stock_number||null,prep_date:o.prep_date||null,delivery_at:o.delivery_at?new Date(o.delivery_at).toISOString():null,status:o.status,notes:o.notes||null});if(error)return alert(error.message);closeModal();await load();render()}}
window.deliveryStatus=async(id,status)=>{let d=DB.deliveries.find(x=>x.id===id);await sb.from('deliveries').update({status}).eq('id',id);if(status==='Delivered')await sb.from('customers').update({status:'Delivered'}).eq('id',d.customer_id);await load();render()};
window.openLeadFile=async id=>{if(!id)return;let l=DB.leads.find(x=>x.id===id);if(!l)return;let c=cust(l.customer_id),h=DB.history.filter(x=>x.lead_id===id).sort((a,b)=>new Date(b.occurred_at)-new Date(a.occurred_at)),f=DB.followups.filter(x=>x.lead_id===id&&x.status!=='Done');modal(`Lead #${l.lead_number} — ${c.name}`,`<div class="card"><b style="font-size:18px">${esc(l.vehicle||'No vehicle')}</b><div class="label">${esc(c.phone||'')} · ${esc(l.source||'')}</div><div style="margin-top:9px"><select id="ls"><option>New</option><option>Contacted</option><option>Appointment</option><option>Showed</option><option>Negotiating</option><option>Sold</option><option>Lost</option></select> <select id="lp"><option>Normal</option><option>Hot</option><option>Low</option></select></div><div style="margin-top:9px;display:flex;gap:7px;flex-wrap:wrap">${c.phone?`<a class="btn secondary" href="tel:${c.phone}">Call</a><a class="btn secondary" href="sms:${c.phone}">Text</a>`:''}<button class="btn secondary" id="fu">Next Action</button><button class="btn secondary" id="del">Schedule Delivery</button></div></div><div class="section"><h2>Upcoming</h2>${f.map(x=>`<div class="hist"><b>${esc(x.action_type)}</b> · ${fmt(x.scheduled_at)}<div>${esc(x.notes||'')}</div></div>`).join('')||'<div class="label">None scheduled.</div>'}</div><div class="section"><h2>Add Note</h2><form id="nf"><textarea name="note" class="search" required></textarea><button class="btn" style="margin-top:7px">Add Note</button></form></div><div class="section"><h2>History</h2>${h.map(x=>`<div class="hist"><span class="label">${fmt(x.occurred_at)}</span><br><b>${esc(x.event_type)}</b><div>${esc(x.note||'')}</div></div>`).join('')||'<div class="label">No history.</div>'}</div>`);$('#ls').value=l.status;$('#lp').value=l.priority;$('#ls').onchange=async e=>{let old=l.status,st=e.target.value;await sb.from('leads').update({status:st}).eq('id',id);await sb.from('customers').update({status:st}).eq('id',l.customer_id);await sb.from('lead_history').insert({owner_id:user.id,lead_id:id,event_type:'Status changed',note:`${old} → ${st}`});await load();render();openLeadFile(id)};$('#lp').onchange=async e=>{await sb.from('leads').update({priority:e.target.value}).eq('id',id);await load();render();openLeadFile(id)};$('#fu').onclick=()=>openFollowup(id,l.customer_id);$('#del').onclick=()=>openDelivery(id,l.customer_id,l.vehicle||'');$('#nf').onsubmit=async e=>{e.preventDefault();let note=new FormData(e.target).get('note');await sb.from('lead_history').insert({owner_id:user.id,lead_id:id,event_type:'Note',note});await load();render();openLeadFile(id)}};
window.customerFile=id=>{let c=cust(id),ls=DB.leases.filter(x=>x.customer_id===id),le=DB.leads.filter(x=>x.customer_id===id);modal(c.name,`<div class="card"><b>${esc(c.phone||'')}</b><div>${esc(c.email||'')}</div><div>${esc(c.city||'')}</div></div><div class="section"><h2>Leads</h2>${le.map(x=>`<div class="lead" onclick="openLeadFile('${x.id}')">Lead #${x.lead_number} · ${esc(x.vehicle||'')} · ${esc(x.status)}</div>`).join('')||'<div class="label">No leads.</div>'}</div><div class="section"><h2>Leases</h2>${ls.map(x=>`<div class="hist">${esc(x.vehicle)} · Ends ${esc(x.lease_end_date||'')}</div>`).join('')}</div>`)};
init();
</script></body></html>
